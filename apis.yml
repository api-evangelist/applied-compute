aid: applied-compute
name: Applied Compute
description: >-
  Applied Compute is a San Francisco AI company founded in 2025 by former OpenAI
  researchers, building "Specific Intelligence" for the enterprise. It operates a
  cloud platform for training, inference, and continuous improvement of custom,
  open AI models and long-horizon, tool-using agents grounded in a company's own
  proprietary data. Rather than selling a generic model, Applied Compute embeds
  engineers with customer teams to fine-tune models, mine production data, run
  online/reinforcement learning, and deploy autonomous agents that operate inside
  the customer's environment with observability over rollouts. The company emerged
  from stealth in October 2025 and is backed by Kleiner Perkins, Benchmark, Sequoia
  Capital, Lux Capital, Greenoaks, Neo, Elad Gil, and others at a reported ~$1.3B
  valuation. Named customers include DoorDash, Cognition, Harvey, and Mercor.
